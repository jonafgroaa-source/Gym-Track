<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi registro de gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5fb; --surface:rgba(255,255,255,.75); --ink:#12142a; --muted:#6a6f8c; --line:rgba(18,20,42,.08);
  --track:rgba(18,20,42,.09); --a1:#6d5efc; --a2:#22d3ee; --glow1:rgba(109,94,252,.25); --glow2:rgba(34,211,238,.22);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0c1a; --surface:rgba(255,255,255,.06); --ink:#f4f5ff; --muted:#9a9fc2; --line:rgba(255,255,255,.1);
    --track:rgba(255,255,255,.1); --glow1:rgba(109,94,252,.35); --glow2:rgba(34,211,238,.18);
  }
}
:root[data-theme="dark"]{
  --bg:#0b0c1a; --surface:rgba(255,255,255,.06); --ink:#f4f5ff; --muted:#9a9fc2; --line:rgba(255,255,255,.1);
  --track:rgba(255,255,255,.1); --glow1:rgba(109,94,252,.35); --glow2:rgba(34,211,238,.18);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Outfit,system-ui,sans-serif;font-size:17px;line-height:1.5;
  background:radial-gradient(60% 40% at 90% 0%,var(--glow1),transparent 70%),radial-gradient(50% 35% at 0% 25%,var(--glow2),transparent 70%),var(--bg);
  background-attachment:fixed}
main{max-width:520px;margin:0 auto;padding:28px 20px 120px}
[hidden]{display:none!important}
.clock{display:flex;justify-content:space-between;align-items:center;gap:12px}
#fecha{text-transform:capitalize;color:var(--muted);font-weight:500;font-size:15px}
.pill{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
h1{font-weight:700;font-size:clamp(36px,10.5vw,52px);line-height:1.05;letter-spacing:-.025em;margin:36px 0 12px}
.frase{margin:0 0 32px;color:var(--muted);max-width:36ch}
.card{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:26px 24px 28px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:transform .15s ease}
.card:active{transform:scale(.98)}
.card:focus-visible,.volver:focus-visible{outline:3px solid var(--a1);outline-offset:3px}
.fila{display:flex;justify-content:space-between;align-items:center;gap:12px}
.etiqueta{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--muted)}
.etiqueta i{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2))}
.flecha{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;flex:none}
.card h2{font-weight:700;font-size:clamp(30px,8.5vw,40px);line-height:1.08;letter-spacing:-.02em;margin:14px 0 6px}
.cuenta{margin:0;color:var(--muted);font-size:18px}
.barra{margin-top:26px}
.pista{height:12px;border-radius:999px;background:var(--track);overflow:hidden}
.relleno{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.meta{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
/* Página de ejercicios */
.volver{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px 8px 12px;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#vista-ejercicios h1{margin-top:28px;margin-bottom:6px}
.sub{margin:0 0 24px;color:var(--muted)}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ej{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .3s,box-shadow .3s}
.ej.abierto{border-color:var(--a1);box-shadow:0 10px 30px var(--glow1)}
.ej-cab{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.ej-cab:focus-visible{outline:3px solid var(--a1);outline-offset:-3px}
.ej-n{flex:1;font-weight:500;display:flex;flex-direction:column;line-height:1.25}
.ej-n small{color:var(--muted);font-weight:400;font-size:14px;margin-top:2px}
.chev{flex:none;color:var(--muted);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.ej.abierto .chev{transform:rotate(180deg)}
.ej-cuerpo{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}
.ej.abierto .ej-cuerpo{grid-template-rows:1fr}
.ej-int{overflow:hidden;min-height:0;opacity:0;transform:translateY(-8px);transition:opacity .3s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.ej.abierto .ej-int{opacity:1;transform:none;transition-delay:.08s}
.pad{padding:2px 18px 18px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campos label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.campos input{font:inherit;font-size:24px;font-weight:600;color:var(--ink);background:var(--track);border:1px solid transparent;border-radius:14px;padding:12px 14px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.campos input:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 3px var(--glow1)}
.guardar{margin-top:14px;width:100%;font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));border:0;border-radius:14px;padding:13px;cursor:pointer;transition:transform .15s}
.guardar:active{transform:scale(.97)}
.ultimo{margin:10px 0 0;font-size:14px;color:var(--muted);min-height:1.4em}
.ej-cab b{flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--muted);background:var(--track);transition:background .3s,color .3s}
.ej.hecho .ej-cab b{color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2))}
.lista-entrenos{display:grid;gap:14px}
.card.mini{background-image:linear-gradient(135deg,color-mix(in srgb,var(--a1) 18%,transparent),color-mix(in srgb,var(--a2) 8%,transparent))}





#vista-ejercicios .volver{margin-bottom:4px}
.paso{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.paso b{font-weight:600;font-size:18px}
.vals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:grid;background:var(--track);border-radius:14px;padding:10px 14px}
.chip small{color:var(--muted);font-size:13px}
.chip strong{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
/* Animaciones */
@property --a1{syntax:'<color>';inherits:true;initial-value:#6d5efc}
@property --a2{syntax:'<color>';inherits:true;initial-value:#22d3ee}
@property --glow1{syntax:'<color>';inherits:true;initial-value:rgba(109,94,252,.25)}
@property --glow2{syntax:'<color>';inherits:true;initial-value:rgba(34,211,238,.22)}
:root{transition:--a1 .8s ease,--a2 .8s ease,--glow1 1s ease,--glow2 1s ease}
body{overflow-x:hidden}
@keyframes entra{from{opacity:0;transform:translateX(var(--dx,0px))}to{opacity:1;transform:none}}
.entra{animation:entra .45s cubic-bezier(.2,.8,.2,1) both}
/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px))}
.tabs-in{display:flex;gap:4px;width:100%;max-width:520px;padding:6px;border-radius:26px;background:color-mix(in srgb,var(--bg) 82%,transparent);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border-radius:20px;font-size:12.5px;font-weight:500;color:var(--muted);text-decoration:none;transition:background .3s,color .3s}
.tabs a.activa{color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2))}
.tabs a:focus-visible{outline:3px solid var(--a1);outline-offset:2px}
/* Calendario */
#vista-registro h1{margin-top:28px;margin-bottom:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:20px 16px 22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.cal-cab{display:flex;justify-content:space-between;align-items:center;margin:0 4px 14px}
.cal-cab h2{margin:0;font-size:20px;font-weight:600;text-transform:capitalize}
.cal-nav{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--track);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.cal-nav:focus-visible,.dia:focus-visible{outline:3px solid var(--a1);outline-offset:2px}
.sem,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sem span{text-align:center;font-size:13px;color:var(--muted);padding-bottom:4px}
.dia{aspect-ratio:1;border:0;border-radius:50%;font:inherit;font-size:15px;font-weight:500;color:var(--ink);background:transparent;cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.dia.marcado{color:#fff;font-weight:600}
.dia.hoy{box-shadow:inset 0 0 0 2px var(--ink)}
.dia.sel{outline:2px solid var(--a1);outline-offset:2px}
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;margin:18px 4px 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.detalle{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.detalle p{margin:4px 0 0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.relleno,.card,.ej-cuerpo,.ej-int,.chev,.tabs a{transition:none}:root{transition:none}.entra{animation:none}}
</style>
</head>
<body>
<main>
  <!-- Página principal -->
  <div id="vista-inicio">
    <div class="clock"><span id="fecha"></span><span class="pill" id="hora"></span></div>
    <h1 id="saludo"></h1>
    <p class="frase" id="frase"></p>
    <button class="card" id="entreno" type="button" aria-label="Ver ejercicios del entrenamiento"></button>
  </div>

  <!-- Página de ejercicios -->
  <div id="vista-ejercicios" hidden>
    <button class="volver" id="ej-volver" type="button" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span id="ej-volver-txt">Entrenamientos</span>
    </button>
    <h1 id="ej-titulo"></h1>
    <p class="sub" id="ej-sub"></p>
    <div class="lista-entrenos" id="ej-entrenos"></div>
    <ol class="lista" id="ej-lista"></ol>
  </div>

  <!-- Registro (calendario) -->
  <div id="vista-registro" hidden>
    <h1>Registro</h1>
    <p class="sub">Tus entrenamientos realizados</p>
    <section class="panel">
      <div class="cal-cab">
        <button class="cal-nav" id="mes-ant" type="button" aria-label="Mes anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <h2 id="mes-titulo"></h2>
        <button class="cal-nav" id="mes-sig" type="button" aria-label="Mes siguiente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div class="sem"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="cal-grid" id="cal-grid"></div>
      <ul class="leyenda" id="leyenda"></ul>
    </section>
    <div class="detalle" id="cal-detalle" aria-live="polite"></div>
  </div>
</main>

<nav class="tabs" aria-label="Secciones"><div class="tabs-in">
  <a href="#inicio" data-tab="inicio"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
  <a href="#ejercicios" data-tab="ejercicios"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Entrenamientos</a>
  <a href="#registro" data-tab="registro"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/></svg>Registro</a>
</div></nav>

<script>
// Orden de los entrenamientos: A → B → C → A...
var ENTRENOS = {
  A:{nombre:'Piernas y glúteos', c:['#ff4d8d','#ff9a3c'], ejercicios:[
    {n:'Sentadilla Smith', s:'4 x 10'},
    {n:'Press de banca a 45 grados', s:'4 x 10'},
    {n:'Extensión de piernas', s:'4 x 10'},
    {n:'Femoral sentado', s:'4 x 10'},
    {n:'Hip thrust', s:'4 x 10'},
    {n:'Talón', s:'4 x 10'},
    {n:'Máquina abductora', s:'4 x 10'},
    {n:'Máquina aductora', s:'4 x 10'}
  ]},
  B:{nombre:'Bíceps y espalda', c:['#6d5efc','#22d3ee'], ejercicios:[
    {n:'Bíceps en polea baja', d:'Barra Z', s:'3 x 12'},
    {n:'Curl de bíceps (en banco)', s:'3 x 12'},
    {n:'Remo', s:'3 x 12'},
    {n:'Jalón dorsal', s:'3 x 12'},
    {n:'Lat pulldown', s:'3 x 12'},
    {n:'Dominadas asistidas', s:'3 x 12'}
  ]},
  C:{nombre:'Pecho, hombro y tríceps', c:['#0ea968','#5fbf3a'], ejercicios:[
    {n:'Pec fly', s:'3 x 12'},
    {n:'Press inclinado', s:'3 x 12'},
    {n:'Aperturas inclinadas', s:'3 x 12'},
    {n:'Tras nuca', s:'3 x 12'},
    {n:'Press francés', d:'Barra Z', s:'3 x 12'},
    {n:'Extensión de tríceps', s:'3 x 12'},
    {n:'Pull over', s:'3 x 12'}
  ]}
};
var LB = 2.20462, CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var FRASES = [
  'Cada repetición te acerca a la mejor versión de ti.',
  'No tienes que ser perfecto, solo constante.',
  'Hoy suma. Mañana te lo vas a agradecer.',
  'El esfuerzo de hoy es el resultado de mañana.',
  'Empieza ligero, termina fuerte.',
  'Tu único rival es quien fuiste ayer.',
  'La disciplina vence a la motivación.'
];
var $ = function(id){ return document.getElementById(id); };
Object.keys(ENTRENOS).forEach(function(key){ ENTRENOS[key].ejercicios = ENTRENOS[key].ejercicios.map(function(x){ return typeof x === 'string' ? {n:x, s:''} : x; }); });
var NEXT = {A:'B', B:'C', C:'A'};
var SEQ = {k:'A', done:[]}; // entrenamiento actual y ejercicios ya registrados
try { var sv = JSON.parse(localStorage.getItem('gym:seq') || 'null'); if(sv && ENTRENOS[sv.k]) SEQ = sv; } catch(_) {}
var k = SEQ.k, e = ENTRENOS[k], total = e.ejercicios.length;

// Ejercicios completados en el ciclo actual de cada entrenamiento (se reinicia al completarlo)
var PROG = {A:[], B:[], C:[]};
try { var pv = JSON.parse(localStorage.getItem('gym:prog') || 'null'); if(pv){ PROG = pv; } else if(SEQ.done){ PROG[SEQ.k] = SEQ.done.slice(); } } catch(_) {}
function guardarEstado(){ try { localStorage.setItem('gym:seq', JSON.stringify({k:SEQ.k})); localStorage.setItem('gym:prog', JSON.stringify(PROG)); } catch(_) {} }

// Color propio de cada entrenamiento
// Guía de cardio (no es un entrenamiento: no se registra ni cuenta en la secuencia)
var CARDIO = {
  nombre:'Cardio', sub:'Guía en cinta · 20 minutos · No se registra', c:['#f59e0b','#ef4444'],
  pasos:[{m:'Min 1-5', i:5, v:3}, {m:'Min 5-10', i:8, v:3.8}, {m:'Min 10-15', i:11, v:4}, {m:'Min 15-20', i:12, v:4}]
};
function tarjetaCardio(){
  return '<button class="card mini" type="button" data-k="CARDIO" style="--a1:' + CARDIO.c[0] + ';--a2:' + CARDIO.c[1] + '">' +
    '<div class="fila"><span class="etiqueta"><i></i>Guía</span>' +
    '<span class="flecha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></div>' +
    '<h2>Cardio</h2><p class="cuenta">20 minutos</p></button>';
}
function aplicarColor(key){
  var c = (ENTRENOS[key] || CARDIO).c, s = document.documentElement.style;
  function rgba(h,a){ var n = parseInt(h.slice(1),16); return 'rgba(' + (n>>16) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')'; }
  s.setProperty('--a1', c[0]); s.setProperty('--a2', c[1]);
  s.setProperty('--glow1', rgba(c[0], .3)); s.setProperty('--glow2', rgba(c[1], .22));
}
aplicarColor(k);

// Registro de pesos (guardado en este navegador)
var LOG = {};
try { LOG = JSON.parse(localStorage.getItem('gym:log') || '{}'); } catch(_) {}
function guardarLog(){ try { localStorage.setItem('gym:log', JSON.stringify(LOG)); } catch(_) {} }
function hoyStr(){ var d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
function hechosHoy(key){ key = key || k; var c = 0; ENTRENOS[key].ejercicios.forEach(function(x,i){ var r = LOG[key+':'+i]; if(r && r.f === hoyStr()) c++; }); return c; }
// Historial de entrenamientos realizados, por día
var HIST = {};
try { HIST = JSON.parse(localStorage.getItem('gym:hist') || '{}'); } catch(_) {}
function actualizarHist(key){
  key = key || k;
  var n = hechosHoy(key);
  if(n > 0){ HIST[hoyStr()] = {k:key, n:n}; try { localStorage.setItem('gym:hist', JSON.stringify(HIST)); } catch(_) {} }
}
actualizarHist();
function fmt(v){ return String(Math.round(v*10)/10); }
function num(s){ var v = parseFloat(String(s).replace(',', '.')); return isFinite(v) && v > 0 ? v : null; }

function saludo(h){ return h<12 ? 'Buenos días' : h<19 ? 'Buenas tardes' : 'Buenas noches'; }
function tick(){
  var d = new Date();
  $('fecha').textContent = d.toLocaleDateString('es', {weekday:'long', day:'numeric', month:'long'});
  $('hora').textContent = d.toLocaleTimeString('es', {hour:'2-digit', minute:'2-digit'});
  $('saludo').textContent = saludo(d.getHours()) + ', ¡a entrenar!';
}

function pintarInicio(){
  var hechos = PROG[k].length, pct = Math.round(hechos/total*100);
  $('entreno').innerHTML =
    '<div class="fila"><span class="etiqueta"><i></i>Entrenamiento ' + k + '</span>' +
    '<span class="flecha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></div>' +
    '<h2>' + e.nombre + '</h2><p class="cuenta">' + total + ' ejercicios</p>' +
    '<div class="barra"><div class="pista" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><div class="relleno" id="rel"></div></div>' +
    '<div class="meta"><span>' + hechos + ' de ' + total + ' completados</span><span>' + pct + '%</span></div></div>';
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ var r=$('rel'); if(r) r.style.width = pct + '%'; }); });
}

function pintarEjercicios(){
  var kk = SELK, ee = kk ? ENTRENOS[kk] : null;
  $('ej-volver').hidden = !kk; $('ej-lista').hidden = !kk; $('ej-entrenos').hidden = !!kk;
  var vista = $('vista-ejercicios');
  if(!kk){
    aplicarColor(k);
    $('ej-titulo').textContent = 'Entrenamientos';
    $('ej-sub').textContent = 'Elige un entrenamiento';
    $('ej-entrenos').innerHTML = Object.keys(ENTRENOS).map(function(key){
      var en = ENTRENOS[key], t = en.ejercicios.length;
      return '<button class="card mini" type="button" data-k="' + key + '" style="--a1:' + en.c[0] + ';--a2:' + en.c[1] + '">' +
        '<div class="fila"><span class="etiqueta"><i></i>Entrenamiento ' + key + '</span>' +
        '<span class="flecha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></div>' +
        '<h2>' + en.nombre + '</h2><p class="cuenta">' + t + ' ejercicios</p></button>';
    }).join('') + tarjetaCardio();
    return;
  }
  aplicarColor(kk);
  if(kk === 'CARDIO'){
    $('ej-volver-txt').textContent = 'Entrenamientos';
    $('ej-titulo').textContent = CARDIO.nombre;
    $('ej-sub').textContent = CARDIO.sub;
    $('ej-lista').innerHTML = CARDIO.pasos.map(function(p){
      return '<li class="paso"><b>' + p.m + '</b><div class="vals">' +
        '<div class="chip"><small>Inclinación</small><strong>' + p.i + '</strong></div>' +
        '<div class="chip"><small>Velocidad</small><strong>' + p.v + '</strong></div></div></li>';
    }).join('');
    return;
  }
  $('ej-titulo').textContent = ee.nombre;
  $('ej-volver-txt').textContent = DESDEINICIO ? 'Inicio' : 'Entrenamientos';
  $('ej-sub').textContent = ee.ejercicios.length + ' ejercicios';
  $('ej-lista').innerHTML = ee.ejercicios.map(function(x,i){
    var r = LOG[kk+':'+i], hecho = !!r && PROG[kk].indexOf(i) > -1;
    return '<li class="ej' + (hecho ? ' hecho' : '') + '" data-i="' + i + '">' +
      '<button class="ej-cab" type="button" aria-expanded="false"><b>' + (hecho ? CHECK : (i+1)) + '</b>' +
      '<span class="ej-n">' + x.n + ((x.d || x.s) ? '<small>' + [x.d, x.s].filter(Boolean).join(' · ') + '</small>' : '') + '</span>' +
      '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>' +
      '<div class="ej-cuerpo"><div class="ej-int"><div class="pad"><div class="campos">' +
      '<label>Peso (kg)<input data-u="kg" type="text" inputmode="decimal" placeholder="0" value="' + (r ? fmt(r.kg) : '') + '"></label>' +
      '<label>Peso (lb)<input data-u="lb" type="text" inputmode="decimal" placeholder="0" value="' + (r ? fmt(r.kg*LB) : '') + '"></label></div>' +
      '<button class="guardar" type="button">Guardar peso</button>' +
      '<p class="ultimo" aria-live="polite">' + (r ? 'Último registro: ' + fmt(r.kg) + ' kg' : '') + '</p></div></div></div></li>';
  }).join('');
}

$('ej-lista').addEventListener('input', function(ev){
  var t = ev.target; if(!t.matches('input')) return;
  var otro = t.closest('.ej-int').querySelector(t.dataset.u === 'kg' ? '[data-u=lb]' : '[data-u=kg]');
  var v = num(t.value);
  otro.value = v === null ? '' : fmt(t.dataset.u === 'kg' ? v*LB : v/LB);
});

$('ej-lista').addEventListener('click', function(ev){
  var cab = ev.target.closest('.ej-cab'), gu = ev.target.closest('.guardar');
  if(cab){
    var li = cab.parentNode, abrir = !li.classList.contains('abierto');
    document.querySelectorAll('.ej.abierto').forEach(function(x){ x.classList.remove('abierto'); x.querySelector('.ej-cab').setAttribute('aria-expanded','false'); });
    if(abrir){ li.classList.add('abierto'); cab.setAttribute('aria-expanded','true'); }
  } else if(gu){
    var it = gu.closest('.ej'), kg = num(it.querySelector('[data-u=kg]').value), msg = it.querySelector('.ultimo');
    if(kg === null){ msg.textContent = 'Escribe el peso usado.'; return; }
    LOG[SELK+':'+it.dataset.i] = {kg:kg, f:hoyStr()}; guardarLog(); actualizarHist(SELK);
    var completado = false, idx = +it.dataset.i, p = PROG[SELK];
    if(p.indexOf(idx) < 0) p.push(idx);
    if(p.length >= ENTRENOS[SELK].ejercicios.length){
      completado = true; PROG[SELK] = [];
      if(SELK === SEQ.k){ SEQ = {k:NEXT[SEQ.k], done:[]}; k = SEQ.k; e = ENTRENOS[k]; total = e.ejercicios.length; }
    }
    guardarEstado();
    it.classList.add('hecho'); it.querySelector('.ej-cab b').innerHTML = CHECK;
    msg.textContent = 'Guardado: ' + fmt(kg) + ' kg / ' + fmt(kg*LB) + ' lb' + (completado ? ' · ¡Entrenamiento completado!' : '');
    if(completado) setTimeout(pintarEjercicios, 1600);
  }
});

// Calendario
var SELK = null; // entrenamiento abierto en la pestaña Entrenamientos (null = lista)
var DESDEINICIO = false; // true si se abrió desde la tarjeta de Inicio
var MES = new Date(); MES.setDate(1);
var SEL = hoyStr();
function pintarRegistro(){
  var y = MES.getFullYear(), m = MES.getMonth(), h = '';
  $('mes-titulo').textContent = MES.toLocaleDateString('es', {month:'long'}) + ' ' + MES.getFullYear();
  var primero = (new Date(y, m, 1).getDay() + 6) % 7, dias = new Date(y, m+1, 0).getDate();
  for(var i = 0; i < primero; i++) h += '<span></span>';
  for(var d = 1; d <= dias; d++){
    var key = y + '-' + (m+1) + '-' + d, r = HIST[key], cls = 'dia', st = '';
    if(r && ENTRENOS[r.k]){ var c = ENTRENOS[r.k].c; cls += ' marcado'; st = ' style="background:linear-gradient(135deg,' + c[0] + ',' + c[1] + ')"'; }
    if(key === hoyStr()) cls += ' hoy';
    if(key === SEL) cls += ' sel';
    h += '<button type="button" class="' + cls + '" data-d="' + key + '"' + st + '>' + d + '</button>';
  }
  $('cal-grid').innerHTML = h;
  var p = SEL.split('-'), f = new Date(+p[0], +p[1]-1, +p[2]), r2 = HIST[SEL];
  $('cal-detalle').innerHTML = '<b style="text-transform:capitalize">' + f.toLocaleDateString('es', {weekday:'long', day:'numeric', month:'long'}) + '</b><p>' +
    (r2 && ENTRENOS[r2.k] ? 'Entrenamiento ' + r2.k + ': ' + ENTRENOS[r2.k].nombre + ' · ' + r2.n + ' de ' + ENTRENOS[r2.k].ejercicios.length + ' ejercicios' : 'Sin entrenamiento registrado') + '</p>';
}

var VISTA = 'inicio';
function animar(el, dx){ el.style.setProperty('--dx', dx + 'px'); el.classList.remove('entra'); void el.offsetWidth; el.classList.add('entra'); }

function ruta(){
  var h = location.hash.replace('#', '');
  if(h !== 'ejercicios' && h !== 'registro') h = 'inicio';
  var orden = ['inicio','ejercicios','registro'], dir = orden.indexOf(h) - orden.indexOf(VISTA);
  ['inicio','ejercicios','registro'].forEach(function(t){
    $('vista-' + t).hidden = t !== h;
    var b = document.querySelector('[data-tab=' + t + ']');
    b.classList.toggle('activa', t === h);
    if(t === h) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if(h !== VISTA) animar($('vista-' + h), dir > 0 ? 28 : -28);
  VISTA = h;
  window.scrollTo(0,0);
  aplicarColor(h === 'ejercicios' && SELK ? SELK : k);
  if(h === 'inicio') pintarInicio();
  if(h === 'registro') pintarRegistro();
}

$('entreno').addEventListener('click', function(){ DESDEINICIO = true; SELK = k; pintarEjercicios(); location.hash = 'ejercicios'; });
$('ej-entrenos').addEventListener('click', function(ev){ var b = ev.target.closest('.card'); if(b){ DESDEINICIO = false; SELK = b.dataset.k; pintarEjercicios(); window.scrollTo(0,0); animar($('vista-ejercicios'), 28); } });
$('ej-volver').addEventListener('click', function(){
  if(DESDEINICIO){ DESDEINICIO = false; location.hash = 'inicio'; return; }
  SELK = null; pintarEjercicios(); window.scrollTo(0,0); animar($('vista-ejercicios'), -28);
});
document.querySelector('[data-tab=ejercicios]').addEventListener('click', function(){ DESDEINICIO = false; SELK = null; pintarEjercicios(); });
$('mes-ant').addEventListener('click', function(){ MES.setMonth(MES.getMonth() - 1); pintarRegistro(); });
$('mes-sig').addEventListener('click', function(){ MES.setMonth(MES.getMonth() + 1); pintarRegistro(); });
$('cal-grid').addEventListener('click', function(ev){ var b = ev.target.closest('.dia'); if(b){ SEL = b.dataset.d; pintarRegistro(); } });
$('leyenda').innerHTML = Object.keys(ENTRENOS).map(function(key){ var c = ENTRENOS[key].c; return '<li><i style="background:linear-gradient(135deg,' + c[0] + ',' + c[1] + ')"></i>' + key + ' · ' + ENTRENOS[key].nombre + '</li>'; }).join('');
window.addEventListener('hashchange', ruta);

$('frase').textContent = FRASES[Math.floor(Math.random()*FRASES.length)];
tick(); pintarEjercicios(); ruta();
setInterval(tick, 1000);
</script>
</body>
