<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Registro de Entrenamiento</title>
<style>
  :root{
    --bg:#131215;
    --surface:#1B1A1E;
    --surface-2:#242327;
    --border:#332F35;
    --text:#ECEAE6;
    --text-dim:#8F8B92;
    --accent-bg:#ECEAE6;
    --accent-fg:#131215;
    --success:#4CAF77;
    --success-bg:#1C2B22;
    --pr:#D9A64A;
    --day1:#7FAE7F;
    --day2:#7FA0C9;
    --day3:#C9A15D;
    --font: -apple-system, "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:50px;
  }
  .wrap{max-width:620px;margin:0 auto;padding:0 20px;}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(19,18,21,0.85);
    backdrop-filter:blur(8px);
    padding-top:26px;
  }
  .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:18px;}
  .brand-eyebrow{
    font-size:11px;letter-spacing:.1em;color:var(--text-dim);text-transform:uppercase;
    font-weight:600;
  }
  h1{
    font-weight:600;
    font-size:21px;
    letter-spacing:-.01em;
    margin:3px 0 0 0;
  }
  .head-actions{display:flex;gap:8px;flex-shrink:0;padding-top:1px;}
  .icon-btn{
    width:36px;height:36px;border-radius:50%;
    background:transparent;border:1px solid var(--border);
    color:var(--text);display:flex;align-items:center;justify-content:center;
    font-size:15px;cursor:pointer;transition:background .15s, border-color .15s;
  }
  .icon-btn:hover{background:var(--surface-2);border-color:var(--text-dim);}

  .tabs{display:flex;border-bottom:1px solid var(--border);}
  .tab{
    display:flex;align-items:center;gap:7px;justify-content:center;
    font-weight:500;
    font-size:13.5px;
    background:none;border:none;
    color:var(--text-dim);
    padding:0 0 12px 0;cursor:pointer;white-space:nowrap;
    flex:1;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    transition:color .15s, border-color .15s;
  }
  .tab .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;flex-shrink:0;}
  .tab.active{color:var(--text);font-weight:600;border-bottom-color:var(--tab-color, var(--text));}
  .tab.active .dot{opacity:1;background:var(--tab-color, var(--text));}

  .day-heading{
    display:flex;flex-direction:column;gap:9px;
    padding:20px 0 16px 0;
  }
  .day-heading-top{display:flex;align-items:baseline;justify-content:space-between;}
  .day-heading .label{color:var(--text);font-size:15px;font-weight:600;}
  .progress-text{font-size:12px;color:var(--text-dim);font-family:var(--font-mono);flex-shrink:0;}
  .progress-track{width:100%;height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;}
  .progress-fill{height:100%;background:var(--success);border-radius:3px;transition:width .3s ease;min-width:0;}

  /* ---------- exercise rows ---------- */
  .card{
    border-bottom:1px solid var(--border);
  }
  .card:first-child{border-top:1px solid var(--border);}

  .card-head{
    display:flex;align-items:center;gap:12px;
    padding:14px 0;cursor:pointer;user-select:none;
  }
  .checkbox{
    width:22px;height:22px;border-radius:50%;
    border:1.5px solid var(--border);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:transparent;
    font-size:12px;
    background:transparent;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .checkbox.done{background:var(--success);border-color:var(--success);color:#0e150f;}

  .card-main{flex:1;min-width:0;}
  .ex-name{font-size:15px;font-weight:500;line-height:1.3;}
  .ex-sub{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .card-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .chip{
    font-family:var(--font-mono);font-size:12px;
    color:var(--text-dim);
  }
  .chip.pr{color:var(--pr);font-weight:600;}
  .chevron{color:var(--text-dim);transition:transform .2s;font-size:13px;}
  .card.open .chevron{transform:rotate(90deg);}

  .card-body{
    max-height:0;opacity:0;
    transition:max-height .25s ease, opacity .2s ease;
    overflow:hidden;
  }
  .card.open .card-body{max-height:900px;opacity:1;padding:2px 0 20px 34px;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1 / -1;}
  label{font-size:11px;letter-spacing:.03em;color:var(--text-dim);font-weight:500;}
  input, textarea{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    padding:9px 10px;
    font-size:16px;
    font-family:var(--font-mono);
    width:100%;
  }
  textarea{font-family:var(--font);font-size:14px;resize:vertical;min-height:38px;}
  input:focus, textarea:focus{outline:none;border-color:var(--text);}

  .save-btn{
    margin-top:12px;width:100%;
    background:var(--accent-bg);color:var(--accent-fg);border:none;
    font-weight:600;
    font-size:14px;padding:11px;border-radius:8px;cursor:pointer;
    transition:opacity .15s;
  }
  .save-btn:hover{opacity:.85;}
  .flash{color:var(--success);font-size:12px;margin-top:8px;text-align:center;height:14px;}

  .history{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
  .history-title{font-size:11px;color:var(--text-dim);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px;font-weight:600;}
  .hist-row{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:7px 0;
    font-size:13px;
  }
  .hist-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .hist-date{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);}
  .hist-detail{font-family:var(--font-mono);color:var(--text);}
  .hist-notes{color:var(--text-dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
  .hist-del{
    background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;
    padding:4px 8px;flex-shrink:0;
  }
  .hist-del:hover{color:var(--text);}
  .empty-hist{color:var(--text-dim);font-size:12px;padding:4px 0;}

  .finish-wrap{padding:22px 0 6px;}
  .finish-btn{
    width:100%;padding:13px;border-radius:8px;
    background:transparent;border:1.5px solid var(--text);color:var(--text);
    font-weight:600;font-size:14px;cursor:pointer;
    transition:background .15s, color .15s;
  }
  .finish-btn:hover{background:var(--accent-bg);color:var(--accent-fg);}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
    background:var(--accent-bg);color:var(--accent-fg);padding:11px 18px;border-radius:24px;
    font-size:13px;font-weight:500;opacity:0;pointer-events:none;
    transition:opacity .25s, transform .25s;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- bodyweight modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--surface);
    border-radius:20px 20px 0 0;
    width:100%;max-width:620px;max-height:85vh;overflow-y:auto;
    padding:20px 20px 28px 20px;
    animation:slideup .25s ease both;
  }
  @keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .sheet-head h2{font-size:17px;font-weight:600;margin:0;}
  .close-x{background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;}

  .bw-form{display:flex;gap:8px;margin-bottom:18px;}
  .bw-form input[type=date]{flex:1.2;}
  .bw-form input[type=number]{flex:1;}
  .bw-form button{
    background:var(--accent-bg);color:var(--accent-fg);border:none;border-radius:8px;
    padding:0 16px;font-weight:600;cursor:pointer;font-size:14px;
  }
  svg.spark{width:100%;height:90px;display:block;margin-bottom:14px;}
  .spark-empty{color:var(--text-dim);font-size:13px;text-align:center;padding:20px 0;}

  /* ---------- menu ---------- */
  .menu{
    position:absolute;right:20px;top:60px;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;overflow:hidden;
    display:none;z-index:30;min-width:190px;
    box-shadow:0 8px 24px rgba(0,0,0,0.08);
  }
  .menu.show{display:block;}
  .menu button{
    display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);
    padding:12px 14px;font-size:13px;cursor:pointer;font-family:var(--font);
  }
  .menu button:hover{background:var(--surface-2);}
  .menu button + button{border-top:1px solid var(--border);}

  footer{text-align:center;color:var(--text-dim);font-size:11.5px;padding:30px 0 10px;}

  @media (prefers-reduced-motion: reduce){
    .card-body, .toast, .sheet, .checkbox, .progress-fill{transition:none;animation:none;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="title-row">
      <div>
        <div class="brand-eyebrow">Bitácora personal</div>
        <h1>Registro de Entrenamiento</h1>
      </div>
      <div class="head-actions">
        <button class="icon-btn" id="bwBtn" title="Peso corporal">⚖</button>
        <button class="icon-btn" id="menuBtn" title="Más opciones">⋮</button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
</header>

<div class="menu" id="menu">
  <button id="exportBtn">Exportar datos (JSON)</button>
  <button id="importBtn">Importar datos (JSON)</button>
  <input type="file" id="importFile" accept="application/json" style="display:none;">
</div>

<main class="wrap">
  <div class="day-heading" id="dayHeading"></div>
  <div id="cards"></div>
  <div class="finish-wrap">
    <button class="finish-btn" id="finishBtn">Finalizar entrenamiento</button>
  </div>
</main>

<footer>Tus datos se guardan solo en este navegador — hazlos respaldo desde el menú ⋮</footer>

<div class="toast" id="toast"></div>

<div class="overlay" id="bwOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Peso corporal</h2>
      <button class="close-x" id="bwClose">✕</button>
    </div>
    <div class="bw-form">
      <input type="date" id="bwDate">
      <input type="number" id="bwWeight" placeholder="kg" step="0.1" min="0">
      <button id="bwSave">Guardar</button>
    </div>
    <div id="bwChartWrap"></div>
    <div class="history-title">Historial</div>
    <div id="bwHistory"></div>
  </div>
</div>

<script>
(function(){
  const ROUTINE = [
    { id:'d1', name:'Piernas y Glúteos', hex:'#6B8E6B', exercises:[
      {id:'d1-1', name:'Sentadilla Smith', target:'4 x 10'},
      {id:'d1-2', name:'Talón', target:'4 x 10'},
      {id:'d1-3', name:'Máquina de Abducción', target:'4 x 10'},
      {id:'d1-4', name:'Máquina de Aducción', target:'4 x 10'},
      {id:'d1-5', name:'Prensa Inclinada', target:'4 x 10'},
      {id:'d1-6', name:'Máquina de Glúteo', target:'4 x 10'},
      {id:'d1-7', name:'Máquina de Femoral Sentado', target:'4 x 10'},
      {id:'d1-8', name:'Máquina de Femoral Acostado', target:'4 x 10'},
      {id:'d1-9', name:'Máquina de Extensión de Piernas', target:'4 x 10'},
    ]},
    { id:'d2', name:'Pecho, Hombro y Tríceps', hex:'#6B84A6', exercises:[
      {id:'d2-1', name:'Press en banco inclinado', target:'3 x 10'},
      {id:'d2-2', name:'Press en banco plano', target:'3 x 10'},
      {id:'d2-3', name:'Press de pecho', target:'4 x 10'},
      {id:'d2-4', name:'Tras Nuca', target:'3 x 12'},
      {id:'d2-5', name:'Extensión de tríceps', target:'3 x 12'},
      {id:'d2-6', name:'Elevación Lateral', target:'3 x 10'},
      {id:'d2-7', name:'Press Militar', target:'3 x 10'},
      {id:'d2-8', name:'Vuelo Frontal', target:'2 x 12'},
    ]},
    { id:'d3', name:'Espalda y Bíceps', hex:'#B08B4F', exercises:[
      {id:'d3-1', name:'Curl Predicador', note:'Barra Z', target:'3 x 12'},
      {id:'d3-2', name:'Curl Martillo', target:'4 x 10'},
      {id:'d3-3', name:'Curl de Bíceps en Banco', target:'3 x 10'},
      {id:'d3-4', name:'Remo al Pecho con Triángulo', target:'4 x 12'},
      {id:'d3-5', name:'Remo al Pecho con Barra', target:'4 x 20'},
      {id:'d3-6', name:'Jalón al Pecho con Barra', target:'4 x 15'},
      {id:'d3-7', name:'Jalón Individual', target:'4 x 15'},
      {id:'d3-8', name:'Dominada asistida', target:'4 x 10'},
    ]},
  ];

  let logs = {};        // exerciseId -> [{id,date,weight,adjust,sets,notes}]
  let bodyweight = [];   // [{id,date,weight}]
  let completion = {};   // exerciseId -> true/false
  let activeDay = 'd1';
  let openCard = null;
  let ready = false;

  const $ = sel => document.querySelector(sel);
  const tabsEl = $('#tabs');
  const cardsEl = $('#cards');
  const dayHeadingEl = $('#dayHeading');

  function todayISO(){
    const d = new Date();
    const off = d.getTimezoneOffset();
    return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
  }
  function fmtDate(iso){
    const [y,m,d] = iso.split('-');
    return `${d}/${m}/${y.slice(2)}`;
  }
  function escapeHtml(str){
    return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function showToast(msg){
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  async function loadData(){
    try{
      const raw = localStorage.getItem('workout-logs');
      logs = raw ? JSON.parse(raw) : {};
    }catch(e){ logs = {}; }
    try{
      const raw = localStorage.getItem('bodyweight-log');
      bodyweight = raw ? JSON.parse(raw) : [];
    }catch(e){ bodyweight = []; }
    try{
      const raw = localStorage.getItem('completion-state');
      completion = raw ? JSON.parse(raw) : {};
    }catch(e){ completion = {}; }
    ready = true;
  }
  async function persistLogs(){
    try{ localStorage.setItem('workout-logs', JSON.stringify(logs)); }
    catch(e){ console.error('No se pudo guardar el registro', e); alert('No se pudo guardar. Revisa que tu navegador permita almacenamiento local.'); }
  }
  async function persistBodyweight(){
    try{ localStorage.setItem('bodyweight-log', JSON.stringify(bodyweight)); }
    catch(e){ console.error('No se pudo guardar el peso', e); }
  }
  async function persistCompletion(){
    try{ localStorage.setItem('completion-state', JSON.stringify(completion)); }
    catch(e){ console.error('No se pudo guardar el progreso', e); }
  }

  function maxWeightBefore(exId){
    const arr = logs[exId] || [];
    if(!arr.length) return null;
    return Math.max(...arr.map(e => parseFloat(e.weight) || 0));
  }

  function renderTabs(){
    tabsEl.innerHTML = ROUTINE.map(day => `
      <button class="tab ${day.id===activeDay?'active':''}" data-day="${day.id}" style="--tab-color:${day.hex}">
        <span class="dot" style="color:${day.hex}"></span>${escapeHtml(day.name)}
      </button>
    `).join('');
    tabsEl.querySelectorAll('.tab').forEach(btn=>{
      btn.addEventListener('click', () => {
        activeDay = btn.dataset.day;
        openCard = null;
        render();
      });
    });
  }

  function renderCards(){
    const day = ROUTINE.find(d => d.id === activeDay);
    const total = day.exercises.length;
    const done = day.exercises.filter(ex => completion[ex.id]).length;
    const pct = total ? Math.round((done/total)*100) : 0;

    dayHeadingEl.innerHTML = `
      <span class="day-heading-top">
        <span class="label">${escapeHtml(day.name)}</span>
        <span class="progress-text">${done}/${total} completados</span>
      </span>
      <span class="progress-track"><span class="progress-fill" style="width:${pct}%"></span></span>
    `;

    cardsEl.innerHTML = day.exercises.map(ex => {
      const arr = (logs[ex.id] || []).slice().sort((a,b)=> b.date.localeCompare(a.date));
      const last = arr[0];
      const isOpen = openCard === ex.id;
      const isDone = !!completion[ex.id];
      const subParts = [];
      if(ex.target) subParts.push(ex.target);
      if(ex.note) subParts.push(ex.note);

      const histRows = arr.slice(0,6).map((e, idx) => {
        const priorMax = idx < arr.length - 1
          ? Math.max(...arr.slice(idx+1).map(x=>parseFloat(x.weight)||0))
          : -Infinity;
        const isPR = (parseFloat(e.weight)||0) > priorMax;
        const detail = [
          e.weight ? `${e.weight} kg` : null,
          e.adjust ? `ajuste ${e.adjust}` : null,
          e.sets ? e.sets : null,
        ].filter(Boolean).join(' · ');
        return `
          <div class="hist-row">
            <div class="hist-left">
              <span class="hist-date">${fmtDate(e.date)} ${isPR ? '★' : ''}</span>
              <span class="hist-detail">${escapeHtml(detail) || '—'}</span>
              ${e.notes ? `<span class="hist-notes">${escapeHtml(e.notes)}</span>` : ''}
            </div>
            <button class="hist-del" data-del="${ex.id}|${e.id}" title="Eliminar">✕</button>
          </div>
        `;
      }).join('');

      return `
        <div class="card ${isOpen?'open':''}" data-card="${ex.id}">
          <div class="card-head">
            <button class="checkbox ${isDone?'done':''}" data-check="${ex.id}" aria-label="Marcar completado">✓</button>
            <div class="card-main" data-toggle="${ex.id}">
              <div class="ex-name">${escapeHtml(ex.name)}</div>
              ${subParts.length ? `<div class="ex-sub">${escapeHtml(subParts.join(' · '))}</div>` : ''}
            </div>
            <div class="card-right" data-toggle="${ex.id}">
              ${last && last.weight ? `<span class="chip">${escapeHtml(last.weight)} kg</span>` : ''}
              <span class="chevron">›</span>
            </div>
          </div>
          <div class="card-body">
            <div class="form-grid">
              <div class="field">
                <label>Fecha</label>
                <input type="date" id="date-${ex.id}" value="${todayISO()}">
              </div>
              <div class="field">
                <label>Peso (kg)</label>
                <input type="number" id="weight-${ex.id}" step="0.5" min="0" placeholder="0">
              </div>
              <div class="field">
                <label>Ajuste banco/máquina</label>
                <input type="text" id="adjust-${ex.id}" placeholder="p. ej. nivel 4">
              </div>
              <div class="field">
                <label>Series x reps</label>
                <input type="text" id="sets-${ex.id}" placeholder="${ex.target ? escapeHtml(ex.target) : 'p. ej. 3x10'}">
              </div>
              <div class="field full">
                <label>Notas</label>
                <textarea id="notes-${ex.id}" rows="2" placeholder="Sensación, dolor, técnica..."></textarea>
              </div>
            </div>
            <button class="save-btn" data-save="${ex.id}">Guardar registro</button>
            <div class="flash" id="flash-${ex.id}"></div>
            <div class="history">
              <div class="history-title">Historial reciente</div>
              ${histRows || '<div class="empty-hist">Todavía no hay registros para este ejercicio.</div>'}
            </div>
          </div>
        </div>
      `;
    }).join('');

    cardsEl.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.dataset.toggle;
        openCard = openCard === id ? null : id;
        render();
      });
    });
    cardsEl.querySelectorAll('[data-check]').forEach(el=>{
      el.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        toggleCompletion(el.dataset.check);
      });
    });
    cardsEl.querySelectorAll('[data-save]').forEach(el=>{
      el.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        saveExerciseEntry(el.dataset.save);
      });
    });
    cardsEl.querySelectorAll('[data-del]').forEach(el=>{
      el.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        const [exId, entryId] = el.dataset.del.split('|');
        deleteExerciseEntry(exId, entryId);
      });
    });
  }

  async function toggleCompletion(exId){
    completion[exId] = !completion[exId];
    await persistCompletion();
    render();
  }

  async function saveExerciseEntry(exId){
    const dateVal = $('#date-'+exId).value || todayISO();
    const weightVal = $('#weight-'+exId).value.trim();
    const adjustVal = $('#adjust-'+exId).value.trim();
    const setsVal = $('#sets-'+exId).value.trim();
    const notesVal = $('#notes-'+exId).value.trim();

    if(!weightVal && !adjustVal && !setsVal && !notesVal){
      const flash = $('#flash-'+exId);
      flash.textContent = 'Agrega al menos un dato antes de guardar.';
      flash.style.color = 'var(--text-dim)';
      return;
    }

    const priorMax = maxWeightBefore(exId);
    const entry = {
      id: 'e' + Date.now() + Math.random().toString(16).slice(2),
      date: dateVal,
      weight: weightVal,
      adjust: adjustVal,
      sets: setsVal,
      notes: notesVal,
    };
    if(!logs[exId]) logs[exId] = [];
    logs[exId].push(entry);
    completion[exId] = true;
    await persistLogs();
    await persistCompletion();

    const isPR = weightVal && priorMax !== null && parseFloat(weightVal) > priorMax;
    const flash = $('#flash-'+exId);
    flash.textContent = isPR ? '★ ¡Nuevo máximo registrado!' : 'Registro guardado.';
    flash.style.color = isPR ? 'var(--pr)' : 'var(--success)';

    ['weight','adjust','sets','notes'].forEach(f=>{ const el = $('#'+f+'-'+exId); if(el) el.value=''; });
    render();
  }

  async function deleteExerciseEntry(exId, entryId){
    if(!logs[exId]) return;
    logs[exId] = logs[exId].filter(e => e.id !== entryId);
    await persistLogs();
    render();
  }

  $('#finishBtn').addEventListener('click', async ()=>{
    const day = ROUTINE.find(d => d.id === activeDay);
    const anyDone = day.exercises.some(ex => completion[ex.id]);
    if(!anyDone){
      showToast('No hay ejercicios marcados todavía.');
      return;
    }
    const ok = confirm(`¿Finalizar el entrenamiento de "${day.name}"? Se reiniciará el progreso marcado, pero tus pesos y notas guardadas se conservan.`);
    if(!ok) return;
    day.exercises.forEach(ex => { completion[ex.id] = false; });
    await persistCompletion();
    openCard = null;
    render();
    showToast('Entrenamiento finalizado — ¡buen trabajo!');
  });

  function render(){
    if(!ready) return;
    renderTabs();
    renderCards();
  }

  /* ---------- bodyweight sheet ---------- */
  const bwOverlay = $('#bwOverlay');
  $('#bwBtn').addEventListener('click', ()=>{
    $('#bwDate').value = todayISO();
    renderBw();
    bwOverlay.classList.add('show');
  });
  $('#bwClose').addEventListener('click', ()=> bwOverlay.classList.remove('show'));
  bwOverlay.addEventListener('click', (e)=>{ if(e.target === bwOverlay) bwOverlay.classList.remove('show'); });

  $('#bwSave').addEventListener('click', async ()=>{
    const date = $('#bwDate').value || todayISO();
    const weight = $('#bwWeight').value.trim();
    if(!weight) return;
    bodyweight.push({ id:'w'+Date.now(), date, weight });
    await persistBodyweight();
    $('#bwWeight').value = '';
    renderBw();
    render();
  });

  function renderBw(){
    const sorted = bodyweight.slice().sort((a,b)=> a.date.localeCompare(b.date));
    const wrap = $('#bwChartWrap');
    if(sorted.length < 2){
      wrap.innerHTML = '<div class="spark-empty">Agrega al menos dos registros para ver la tendencia.</div>';
    } else {
      const vals = sorted.map(e=>parseFloat(e.weight)||0);
      const min = Math.min(...vals), max = Math.max(...vals);
      const pad = (max-min) < 1 ? 1 : (max-min)*0.15;
      const lo = min - pad, hi = max + pad;
      const W = 300, H = 80, PADX = 6;
      const pts = sorted.map((e,i)=>{
        const x = PADX + (i/(sorted.length-1)) * (W-PADX*2);
        const y = H - ((parseFloat(e.weight)-lo)/(hi-lo)) * (H-14) - 7;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      wrap.innerHTML = `
        <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <polyline points="${pts}" fill="none" stroke="#ECEAE6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
    }

    const histEl = $('#bwHistory');
    const desc = bodyweight.slice().sort((a,b)=> b.date.localeCompare(a.date));
    histEl.innerHTML = desc.length ? desc.map(e=>`
      <div class="hist-row">
        <div class="hist-left">
          <span class="hist-date">${fmtDate(e.date)}</span>
          <span class="hist-detail">${escapeHtml(e.weight)} kg</span>
        </div>
        <button class="hist-del" data-bwdel="${e.id}" title="Eliminar">✕</button>
      </div>
    `).join('') : '<div class="empty-hist">Todavía no hay registros de peso.</div>';

    histEl.querySelectorAll('[data-bwdel]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        bodyweight = bodyweight.filter(e => e.id !== el.dataset.bwdel);
        await persistBodyweight();
        renderBw();
        render();
      });
    });
  }

  /* ---------- menu: export / import ---------- */
  const menu = $('#menu');
  $('#menuBtn').addEventListener('click', (e)=>{
    e.stopPropagation();
    menu.classList.toggle('show');
  });
  document.addEventListener('click', ()=> menu.classList.remove('show'));

  $('#exportBtn').addEventListener('click', (e)=>{
    e.stopPropagation();
    const data = JSON.stringify({ logs, bodyweight, completion }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `respaldo-entrenamiento-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    menu.classList.remove('show');
  });

  $('#importBtn').addEventListener('click', (e)=>{
    e.stopPropagation();
    $('#importFile').click();
    menu.classList.remove('show');
  });
  $('#importFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(parsed.logs) logs = parsed.logs;
        if(parsed.bodyweight) bodyweight = parsed.bodyweight;
        if(parsed.completion) completion = parsed.completion;
        await persistLogs();
        await persistBodyweight();
        await persistCompletion();
        render();
        alert('Datos importados correctamente.');
      }catch(err){
        alert('El archivo no tiene un formato válido.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  /* ---------- init ---------- */
  (async function init(){
    await loadData();
    render();
  })();
})();
</script>
</body>
</html>
